repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - "types-tqdm"
          - "types-beautifulsoup4"
          - "types-Pillow"
          - "types-PyYAML"
        files: ^src/

  - repo: local
    hooks:
      - id: leakage-tests
        name: leakage regression tests (label polarity, canonicalization, feature dominance)
        entry: pytest tests/test_no_leakage.py tests/test_label_polarity.py tests/test_canonicalize.py -q --no-cov -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
