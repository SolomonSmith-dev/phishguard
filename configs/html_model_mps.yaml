# Mac (MPS, 16 GB) smoke profile for the HTML branch. Not a result config.
seed: 42

data:
  train_path: data/processed/phreshphish/html_train.parquet
  val_path: data/processed/phreshphish/html_val.parquet
  test_path: data/processed/phreshphish/html_test.parquet
  text_col: html_text
  label_col: is_phish

model:
  base: distilbert-base-uncased
  max_length: 512
  num_labels: 2
  dropout: 0.1

training:
  epochs: 1
  batch_size: 4
  grad_accum_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: false
  eval_strategy: epoch
  logging_steps: 5
  max_rss_gb: 6

artifacts:
  output_dir: models/checkpoints/html_model_mps
  onnx_path: null

logging:
  report_to: none
  log_file: models/checkpoints/html_model_mps/train_log.jsonl
